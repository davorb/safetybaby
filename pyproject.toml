[project]
name = "babymon"
version = "0.1.0"
description = "AI baby monitor for a Tapo C210: motion, cry detection, vision checks, push alerts."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "numpy>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "anthropic>=2.3.0",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0",
]

[project.scripts]
babymon = "babymon.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "import-linter>=2.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["babymon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.importlinter]
root_package = "babymon"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the pure core imports no I/O library"
type = "forbidden"
source_modules = ["babymon.domain", "babymon.sleep", "babymon.rules", "babymon.brain"]
forbidden_modules = [
    "anthropic",
    "httpx",
    "fastapi",
    "sqlite3",
    "subprocess",
    "numpy",
    "asyncio",
    "cv2",
    "onnxruntime",
]
